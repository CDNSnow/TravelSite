<!DOCTYPE html>

<html>
<head>
    <title>Thrihnukergiggur Magma Chamber</title>
    <style>
        * {
            padding: 0px;
            box-sizing: border-box;
            background-color: gainsboro;
            font-size: large
        }

        a {
            outline: none;
            text-decoration: underline;
            font-family: Arial, Helvetica, sans-serif;
        }

            a:link {
                color: darkblue;
            }

            a:visited {
                color: blueviolet;
            }

            a:focus {
                border-bottom: 1px solid;
                background: #BAE498;
            }

            a:hover {
                border-bottom: 1px solid;
                background: #CDFEAA;
            }

            a:active {
                background: #265301;
                color: #CDFEAA;
            }

        .header {
            text-align: center;
            color: black;
            font-size: xx-large;
            font-weight: bold;
        }

        .fwdArrow {
            height: 40px;
            width: 50px;
            right: 50px
        }

        .backArrow {
            height: 40px;
            width: 50px;
            left: 50px;
        }

        .text {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center
        }

        .image {
            max-height: 1000px;
            max-width: 1000px;
            left: 50px;
            display: block;
            height: 800px;
        }

        .box {
            display: table-cell;
            text-align: center;
            vertical-align: middle;
            line-height: 13em;
        }

        .vabox {
            display: inline-block;
            text-align: left;
            vertical-align: top;
            line-height: 30px;
            margin: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header {
            align-content: flex-start;
            margin: 10px;
            clear: both;
            font-weight: bold;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            white-space: nowrap;
            vertical-align: top;
            width: 100%;
        }

        .top {
            vertical-align: top;
        }

        .middle {
            vertical-align: middle;
        }

        .spaced {
            margin-left: 50px;
        }

        .bottom {
            vertical-align: 50%;
            line-height: 13em;
        }

        table {
            table-layout: fixed;
            word-break: break-word;
        }
    </style>
    </head>

    <body>
        <!-- header -->
        <table>
            <tr>
                <td>
                    <span class='header'>
                        <script>
                            header = header + "&nbsp|&nbsp&nbsp&nbsp";
                            for (var i = 0, len = links.length; i < len; i++) {
                                header += "<a href=" + hrefs[i] + ">" + links[i] + "</a>"
                                header += "&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp"
                            }
                            document.write(header + "<br/>");
                        </script>
                    </span>
                </td>
            </tr>
            <tr>
                <td>
                    <table>
                        <tr>
                            <td>
                                <!-- back arrow -->
                                <img width="30" alt="" class="box" onclick="goBackward()" src="../goBackward.png" />
                            </td>
                            <td>
                                <!-- picture -->
                                <div style="width:100%;  margin-left: 50px;">
                                    <script>
                                        source = "'" + pictures[currentPic] + "'";
                                        document.write("<img id='currentImage' alt='' class='box image' src=" + source + " />");
                                    </script>
                                </div>
                            </td>
                            <td>
                                <!-- fwd arrow -->
                                <script>
                                    document.write("<img id='fwdarrow' width='30' alt='' class='box spaced' onclick='goForward()' src='../goForward.png' />");
                                    var a = document.getElementById('fwdarrow');
                                    var c = a.getBoundingClientRect().right;
                                </script>
                            </td>


                            <td class="vabox">
                                <!-- text -->
                                <div id='currentText' font-size:20px\>
                                    <script>
                                        text = "";
                                        text += texts[currentPic];
                                        document.write(text);
                                    </script>
                                </div>
                            </td>
                    </table>
                </td>
            </tr>
        </table>
        <!-- counter -->
        <div class="table-row">
            <script type="text/javascript">
                var p = document.getElementById('currentImage');
                var w = p.clientWidth / 2;
                document.write("<span  id='counter' class='table-cell' style='margin-left:" + w + "px';>");
                document.write("<bold>" + currentPic + 1 + " / " + pictures.length + "</bold>");
                document.write("</span>");
            </script>
        </div>


    </body>
</html>
