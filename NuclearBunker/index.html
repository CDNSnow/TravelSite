 id="_x0000_s1086" type="#_x0000_t202" style='position:absolute;left:0;

 <v:fill color2="#ccf" colors="0 #ccf;11796f #9cf;23593f #96f;39977f #c9f;53740f #9cf;1 #ccf"
  method="none" focus="100%" type="gradient"/>
 <v:textbox style='mso-next-textbox:#_x0000_s1086'>
  <![if !mso]>
  <table cellpadding=0 cellspacing=0 width="100%">
   <tr>
    <td><![endif]>
    <div>
    <p class=MsoBodyText2>Resort employees had it figured out that there was a
    bunker somewhere.<span style="mso-spacerun: yes">  </span>They didn’t realize
    that part of the bunker was part of the hotel.<span style="mso-spacerun:
    yes">  </span></p>
    <p class=MsoBodyText2><![if !supportEmptyParas]>&nbsp;<![endif]><o:p></o:p></p>
    <p class=MsoBodyText2>The convention floor was slated to be converted to
    cubes for congressional staff; the overhead lighting was arranged to work
    after cube walls went up.<span style="mso-spacerun: yes">  </span>Two
    conference rooms would be the Senate and House floors; there were exactly
    enough chairs for those two bodies.</p>
    <p class=MsoBodyText2><![if !supportEmptyParas]>&nbsp;<![endif]><o:p></o:p></p>
    <p class=MsoBodyText2>The false wall on the left covers an 18-ton blast
    door.<span style="mso-spacerun: yes">  </span>The outrageous wallpaper was
    chosen to be a distraction to prevent attention from focusing on the false
    wall.<span style="mso-spacerun: yes">  </span>Electronics techs lived
    on-site and actually serviced resort TVs. Their other equipment was hidden
    beyond other false walls.<span style="mso-spacerun: yes">  </span>Locked
    doors on the convention floor led to decontam chambers and the surgical
    suite.</p>
    <p class=MsoBodyText2><![if !supportEmptyParas]>&nbsp;<![endif]><o:p></o:p></p>
    <p class=MsoBodyText2>The hotel converted the kitchen into a culinary
    school.</p>
    <p class=MsoNormal><![if !supportEmptyParas]>&nbsp;<![endif]><o:p></o:p></p>
    </div>
    <![if !mso]></td>
   </tr>
  </table>
  <![endif]></v:textbox>
